<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#141312">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vogels">
<title>Danny's Vogels</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://inaturalist-open-data.s3.amazonaws.com">
<link rel="stylesheet" href="style.css?v=202611081950">
</head>
<body>

<canvas id="petals" aria-hidden="true"></canvas>

<div id="boot" class="boot"><div class="sun"></div></div>

<div id="lock" class="hidden">
  <svg class="tokyo" id="tokyo" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="tkSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--s0)"/>
        <stop offset=".55" style="stop-color:var(--s1)"/>
        <stop offset=".8" style="stop-color:var(--s2)"/>
        <stop offset="1" style="stop-color:var(--s3)"/>
      </linearGradient>
      <radialGradient id="tkSun" cx=".5" cy=".5" r=".5">
        <stop offset="0" style="stop-color:var(--sun1)"/><stop offset=".7" style="stop-color:var(--sun2)"/><stop offset="1" style="stop-color:var(--sun2);stop-opacity:0"/>
      </radialGradient>
    </defs>
    <rect width="1600" height="900" fill="url(#tkSky)"/>
    <g id="tkStars" class="tk-stars"></g>
    <g class="tk-sunwrap"><circle class="tk-sun" cx="800" cy="560" r="230" fill="url(#tkSun)"/></g>
    <path class="tk-fuji" d="M220 700 L520 470 Q560 440 600 470 L900 700Z" style="fill:var(--fuji)"/>
    <path d="M478 502 L520 470 Q560 440 600 470 L642 502 Q620 495 600 505 Q580 490 560 505 Q540 490 520 506 Q500 494 478 502Z" fill="#cdbfb3" opacity=".55"/>
    <g class="tk-clouds"><ellipse cx="300" cy="380" rx="160" ry="14" fill="#ffffff" opacity=".05"/><ellipse cx="1250" cy="330" rx="210" ry="16" fill="#ffffff" opacity=".05"/><ellipse cx="900" cy="250" rx="120" ry="10" fill="#ffffff" opacity=".04"/></g>
    <g id="tkCity"></g>
  </svg>
  <form class="lock-box" id="loginForm" autocomplete="on">
    <img src="icon.svg" alt="" class="lock-icon">
    <h1>Danny's Vogels</h1>
    <p>Log in met je planner-account</p>
    <input type="text" name="username" id="loginUser" placeholder="Gebruikersnaam" autocomplete="username" autocapitalize="none" required>
    <input type="password" name="password" id="loginPass" placeholder="Wachtwoord" autocomplete="current-password" required>
    <button class="btn primary" type="submit" id="loginBtn">Inloggen</button>
    <div class="lock-err" id="lockErr"></div>
  </form>
</div>

<div id="app" class="hidden">
  <div class="cover"><div class="cover-img" id="cover"></div><div class="cover-scene" id="coverScene"></div></div>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <h1>Danny's Vogels</h1>
        <div class="date" id="todayLabel"></div>
        <div class="clocks" id="clocks"></div>
      </div>
      <div class="row top-actions">
        <span id="sync" class="savestate"></span>
        <button class="lockbtn" id="themeBtn">Automatisch</button>
        <button class="lockbtn" id="settingsBtn">Instellingen</button>
      </div>
    </header>
    <div class="demo-bar hidden" id="demoBar"><span><b>Demo</b> met voorbeeldvogels · niets wordt opgeslagen</span><a href="/">Naar je echte boekje</a></div>
    <div class="stats" id="stats"></div>
    <nav class="tabs" id="tabs">
      <button data-tab="boek" class="on">Boekje</button>
      <button data-tab="soorten">Soorten</button>
      <button data-tab="buurt">In de buurt</button>
      <button data-tab="kaart">Kaart</button>
    </nav>
    <main id="view" class="view"></main>
    <footer class="foot"><div class="seigaiha"></div></footer>
  </div>
  <button class="fab" id="addBtn" aria-label="Waarneming toevoegen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-panel" id="sheetPanel"></div>
</div>

<div id="toast" class="toast"></div>

<script src="scene.js?v=202611081950"></script>
<script src="app.js?v=202611081950"></script>
</body>
</html>
