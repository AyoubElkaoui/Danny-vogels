<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f3ede1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121814" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vogels">
<title>Danny's Vogels</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://inaturalist-open-data.s3.amazonaws.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,400&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=202611081830">
</head>
<body>

<div id="boot" class="boot"><img src="icon.svg" alt=""></div>

<div id="lock" class="lock hidden">
  <form class="lock-box" id="loginForm" autocomplete="on">
    <img src="icon.svg" alt="" class="lock-icon">
    <h1>Danny's Vogels</h1>
    <p>Log in met je planner-account</p>
    <input type="text" name="username" id="loginUser" placeholder="Gebruikersnaam" autocomplete="username" autocapitalize="none" required>
    <input type="password" name="password" id="loginPass" placeholder="Wachtwoord" autocomplete="current-password" required>
    <button class="btn primary wide" type="submit" id="loginBtn">Inloggen</button>
    <div class="lock-err" id="lockErr"></div>
  </form>
</div>

<div id="app" class="app hidden">
  <header class="top">
    <div class="brand">
      <img src="icon.svg" alt="" class="brand-icon">
      <div>
        <h1>Danny's Vogels</h1>
        <div class="stats" id="stats"></div>
      </div>
    </div>
    <div class="top-actions">
      <span class="sync" id="sync" title="Opgeslagen"></span>
      <button class="icon-btn" id="settingsBtn" aria-label="Instellingen">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="boek" class="on"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2V5Z"/><path d="M4 19a2 2 0 0 1 2-2h12v4H6a2 2 0 0 1-2-2ZM8 7h6M8 10h4"/></svg><span>Boekje</span></button>
    <button data-tab="soorten"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span>Soorten</span></button>
    <button class="add" id="addBtn" aria-label="Waarneming toevoegen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-tab="buurt"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg><span>In de buurt</span></button>
    <button data-tab="kaart"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg><span>Kaart</span></button>
  </nav>
</div>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-panel" id="sheetPanel"></div>
</div>

<div id="toast" class="toast"></div>

<script src="app.js?v=202611081830"></script>
</body>
</html>
